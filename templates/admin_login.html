<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V-LiSEMOD Admin</title><link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071525;color:#f8fbff;font:16px system-ui,sans-serif}.card{width:min(390px,calc(100% - 48px));padding:36px;border:1px solid #42617f;border-radius:16px;background:#10253a;box-shadow:0 18px 60px #0008}h1{margin:0 0 7px}p{color:#c5d4e2}label{display:block;margin:18px 0 6px;font-weight:700}input{box-sizing:border-box;width:100%;padding:12px;border:2px solid #8fa9bf;border-radius:7px;font:inherit}button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:7px;background:#31d3a0;color:#062019;font-weight:800;font-size:16px}.error{padding:10px;background:#6d1820;color:#fff;border-radius:7px}</style></head><body><main class="card"><div aria-hidden="true">V-LiSEMOD · ADMIN</div><h1>Analytics dashboard</h1><p>Authorized administrators only.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Email <input required name="email" type="email" autocomplete="username"></label><label>Password <input required name="password" type="password" autocomplete="current-password"></label><button type="submit">Sign in</button></form></main></body></html>
