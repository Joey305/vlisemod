<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ images[0].virus_name }} | 
        PDB ID: {{ images[0].pdb_id }} | 
        Ligand: {{ images[0].ligand_code }}
    </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- D3 -->
    <script src="https://d3js.org/d3.v5.min.js"></script>

    <!-- CSS style for drawing -->
    <link rel="stylesheet" href="pdb-ligand-env-svg.css" />

    <!-- CSS style for the component UI -->
    <link rel="stylesheet" href="pdb-ligand-env.css" />

    <!-- UI icons -->
    <link rel="stylesheet" href="https://ebi.emblstatic.net/web_guidelines/EBI-Icon-fonts/v1.3/fonts.css" />

    <!-- Web component polyfill -->
    <script src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs/webcomponents-lite.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs/custom-elements-es5-adapter.js" charset="utf-8"></script>

    <!-- PDBe interactions component -->
    <script type="module" src="pdb-ligand-env-component-0.3.0-min.js"></script>
    
</head>
<body>

<div class="content-container">
    <h1>
        {{ images[0].virus_name }} | PDB ID: {{ images[0].pdb_id }} | Ligand: {{ images[0].ligand_code }}
    </h1>

    {% for image in images %}
    <div class="image-container">
        <!-- This image will be replaced by the 3D viewer -->
        <div id="image-viewer">
            <img src="{{ url_for('static', filename=image.path.split('static/')[1]) }}" alt="{{ image.ligand_code }}" id="ligand-image">
        </div>
        <div id="viewport"></div> <!-- This will be the 3D viewer container -->

        <div class="buttons">
            
            
            <!-- New Button to View 3D in the Same Window -->
            <button id="view-3d-in-window" onclick="replaceWith3D('{{ image.pdb_id }}', '{{ image.ligand_code }}')">3D Molecule Viewer</button>
           
            <!-- <button onclick="submitPymolMovieForm('{{ image.virus_name }}', '{{ image.pdb_id }}', '{{ image.ligand_code }}')">Generate PyMOL Movie</button> -->
            <button onclick="redirectToComingSoon()">Generate PyMOL Movie</button>
           
                   
            <a href="{{ url_for('download_image', filename=image.filename) }}" download="{{ image.filename }}">
                <button>Download {{ images[0].ligand_code }}.png</button>
            </a>
            <a href="{{ url_for('index') }}">
                <button>Back to Main Page</button>
            </a>
            <!-- New Button to View Ligand Interaction Diagram -->
            <button id="view-ligand-interactions" onclick="displayLigandInteractionDiagram('{{ image.pdb_id }}', '{{ image.ligand_code }}')">Display Ligand Interaction Diagram</button>

            <!-- Container for displaying the ligand interaction diagram -->
            <div id="ligand-interaction-container"></div>


             
        </div>
             
    </div>
    {% endfor %}
</div>

<!-- Include the external JavaScript file -->
<script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
<script src="https://unpkg.com/ngl@2.0.0-dev.37/dist/ngl.js"></script>

</body>
</html>
